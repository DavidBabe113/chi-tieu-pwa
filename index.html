<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=3"><link rel="icon" type="image/png" href="icon-192.png?v=3">
<link rel="stylesheet" href="style.css">
<title>Expenses</title>
</head>
<body>
<header>
  <button id="back" class="icon" hidden aria-label="Back">‹</button>
  <img class="logo" src="logo-72.png" alt="" width="36" height="36">
  <h1 id="title">Financial Tracking</h1>
  <button id="openSettings" class="icon" aria-label="Settings">⚙</button>
</header>
<nav id="tabs" class="tabs" style="--i:0">
  <button data-tab="home" class="on">Overview</button>
  <button data-tab="txn">Transactions</button>
  <button data-tab="jars">6 Jars</button>
  <button data-tab="cats">Categories</button>
</nav>
<main>

  <section id="v-cats" hidden>
    <div id="catsBody"></div>
  </section>

  <section id="v-jars" hidden>
    <div id="jarsBody"></div>
  </section>

  <section id="v-home">
    <div id="pending"></div>
    <div id="goals"></div>
    <div id="balance" class="card bal"></div>
    <div id="stats" class="card hero"></div>
    <div id="jarWatch"></div>
    <div id="dash"></div>
  </section>

  <section id="v-txn" hidden>
    <div class="toprow"><div class="seg" id="segTxn"><button data-v="out" class="on">Expense</button><button data-v="in">Income</button><button data-v="photo">Photos</button></div><button id="txnToday" class="todaybtn">Today</button></div>
    <div class="filters"><select id="txnCat" class="jsel" aria-label="Category"></select><button id="txnDay" type="button" class="datebtn" aria-label="Date"></button><button id="txnDayClear" class="icon" hidden aria-label="All days">✕</button></div>
    <div id="txnHead" class="card hero"></div>
    <div id="txnList"></div>
  </section>

  <section id="v-scan" hidden>
    <div class="camwrap">
      <video id="video" playsinline muted></video>
      <button id="scanPhotoBtn" class="camfab" aria-label="Choose from Photos">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 9"/></svg>
      </button>
    </div>
    <p id="scanMsg" class="hint"></p>
  </section>

  <section id="v-cat" hidden>
    <div class="seg" id="segType"><button data-v="expense" class="on">Expense</button><button data-v="income">Income</button></div>
    <div id="qrInfo" class="card" hidden></div>
    <div id="cats" class="grid"></div>
  </section>

  <section id="v-detail" hidden>
    <label>Amount (₫)<input id="amount" inputmode="numeric" placeholder="0"></label>
    <label>Note<input id="note" placeholder="e.g. coffee with a client"></label>
    <div class="photo">
      <label class="snap" aria-label="Take a receipt photo">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg>
        <input id="photoIn" type="file" accept="image/*" capture="environment" hidden>
      </label>
      <img id="preview" alt="" hidden>
      <button id="photoAmt" class="ghost" type="button" hidden>₫ + Amount on photo</button>
    </div>
    <div id="payBox">
      <label>Payment method</label>
      <div id="payPicked" hidden></div>
    <div class="seg" id="segPay"><button data-v="bank" class="on">Banks</button><button data-v="wallet">Wallets</button></div>
    <div class="bsearch"><input id="bankQ" type="search" placeholder="Search" autocapitalize="none" autocorrect="off" hidden><button id="bankSearchBtn" class="icon" aria-label="Search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button></div>
    <div id="banks" class="grid"></div>
    </div>
    <button id="toBank" class="big">Continue to pay</button>
    <button id="saveOnly" class="ghost">Save only</button>
    <button id="saveIncome" class="big" hidden>Save income</button>
  </section>

  <section id="v-settings" hidden>
    <h2>Language</h2>
    <div class="seg" id="segLang"><button data-v="en">English</button><button data-v="vi">Tiếng Việt</button></div>
    <h2>Appearance</h2>
    <div class="seg" id="segTheme"><button data-v="light">Light</button><button data-v="dark">Dark</button><button data-v="auto">Auto</button></div>


    <div id="adminTop">
      <h2>Security</h2>
      <div class="card verrow"><span>PIN lock</span><b id="pinState"></b></div>
      <button id="pinSet" class="ghost">Set PIN</button>
      <button id="pinChange" class="ghost" hidden>Change PIN</button>
      <button id="pinOff" class="ghost" hidden>Turn off PIN</button>
      <div class="card verrow" id="faceRow" hidden><span>Face ID</span><b id="faceState"></b></div>
      <button id="faceOnBtn" class="ghost" hidden>Turn on Face ID</button>
      <button id="faceOffBtn" class="ghost" hidden>Turn off Face ID</button>
      <h2>Data</h2>
      <a id="openSheetLink" class="ghost linkbtn" target="_blank" rel="noopener">📊 Open Google Sheet</a>
      <button id="exportXlsx" class="ghost">📥 Export to Excel</button>
      <button id="openTrash" class="ghost">🗑 Trash</button>
    </div>

    <h2>About</h2>
    <div class="card verrow"><span>Version</span><b id="verText"></b></div>
    <button id="updateApp" class="ghost">Check for updates</button>

    <div id="adminAdv">
      <details class="adv">
        <summary>Advanced</summary>
        <label>Google Sheet file link<input id="sheetFile" placeholder="https://docs.google.com/spreadsheets/d/…/edit"></label>
        <label>Google Apps Script link (Web App)<input id="sheetUrl" placeholder="https://script.google.com/macros/s/…/exec"></label>
        <button id="saveAdv" class="big">Save</button>
        <button id="clearData" class="ghost danger">Reset app</button>
      </details>
    </div>
  </section>

</main>

<button id="saveMonth" class="fab-save" aria-label="Save" hidden><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>

<div id="fabs">
  <div id="addMenu" hidden><button data-t="income">Income</button><button data-t="expense">Expense</button></div>
  <button id="btnManual" class="fab-add" aria-label="Add manually">+</button>
  <button id="btnScan" class="fab-scan" aria-label="Scan QR">
    <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M7.5 12h9"/></svg>
  </button>
</div>

<input id="qrFile" type="file" accept="image/*" hidden>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true">
    <button id="sheetClose" class="icon sheet-x" aria-label="Close">×</button>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="lock" class="lock" hidden>
  <div class="lock-card">
    <div class="lock-ic">🔒</div>
    <h2 id="lockTitle">Enter PIN</h2>
    <div id="dots" class="dots"></div>
    <p id="padMsg" class="padmsg"></p>
    <div id="pad" class="pad"></div>
    <button id="lockFace" class="face" hidden>Use Face ID</button>
    <button id="lockForgot" class="link">Forgot PIN?</button>
    <button id="lockCancel" class="link" hidden>Cancel</button>
  </div>
</div>

<div id="toast" hidden></div>
<script defer src="app.js"></script>
</body>
</html>
